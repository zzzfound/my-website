<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="zzzfound 的个人主页">
  <title>zzzfound · 个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式">🌙</button>

  <main class="container">
    <header class="hero">
      <div class="avatar">Z</div>
      <h1>你好，我是 <span class="highlight">zzzfound</span></h1>
      <p class="subtitle">一个简单、干净的个人主页。</p>
      <p class="clock" id="clock">--:--:--</p>
    </header>

    <section class="cards">
      <div class="card">
        <h2>关于我</h2>
        <p>正在学习前端开发，喜欢把想法变成页面。</p>
      </div>

      <div class="card">
        <h2>技能</h2>
        <ul class="skills">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </div>

      <div class="card">
        <h2>联系</h2>
        <p>GitHub:
          <a href="https://github.com/zzzfound" target="_blank" rel="noopener">@zzzfound</a>
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> zzzfound · 纯前端搭建</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
